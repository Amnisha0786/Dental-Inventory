#########################################################################################################################################

# =============================================
# Server Configuration
# =============================================
server.port=8080
server.servlet.context-path=/

# =============================================
# Database Configuration (MySQL for production)
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/dental_inventory?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 Database (for development/testing - optional)
# Uncomment below and comment MySQL config for H2 usage
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=password
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# =============================================
# JPA/Hibernate Configuration
# =============================================
# Use 'create-drop' for development, 'validate' or 'update' for production
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true

# =============================================
# SQL Initialization
# =============================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# For H2 database dialect (when using H2)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =============================================
# JWT Security Configuration
# =============================================
jwt.secret=yourSecretKeyHereMakeSureItsLongEnoughForHS512AlgorithmAtLeast64CharactersLong
jwt.expiration=86400000
jwt.header=Authorization
jwt.prefix=Bearer

# =============================================
# CORS Configuration
# =============================================
cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://127.0.0.1:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Spring Security CORS configuration
spring.web.cors.allowed-origins=${cors.allowed-origins}
spring.web.cors.allowed-methods=${cors.allowed-methods}
spring.web.cors.allowed-headers=${cors.allowed-headers}
spring.web.cors.allow-credentials=${cors.allow-credentials}

# =============================================
# Logging Configuration
# =============================================
logging.level.com.example.springbootapp=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# =============================================
# Additional Application Properties
# =============================================
# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson serialization
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Spring Security (if using)
spring.security.oauth2.resourceserver.jwt.issuer-uri=

# Actuator endpoints (for monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Profile-specific settings
spring.profiles.active=dev